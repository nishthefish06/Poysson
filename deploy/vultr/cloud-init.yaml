#cloud-config
# Paste this into "Cloud-Init User-Data" when creating a Vultr Ubuntu 24.04 instance.
#
# One isolated server runs everything, behind Caddy with automatic HTTPS:
#   - SpacetimeDB on 127.0.0.1:3000. Only the two endpoints browsers need are public;
#     publishing and admin calls go over SSH (deploy/vultr/deploy.sh and stdb.sh).
#   - The Nuxt app on 127.0.0.1:3001 (deploy/vultr/deploy-web.sh). It starts once deployed.
#   - The bare-bones test client as static files under /test/ (deploy/vultr/deploy-test-client.sh).
#
# Hostname: defaults to <ip-with-dashes>.sslip.io so HTTPS works before a real domain exists.
# To use a custom domain later, point an A record at the server and change the first line of
# /etc/caddy/Caddyfile, then `systemctl reload caddy`.

package_update: true
packages:
  - caddy
  - ufw
  - curl
  - rsync

write_files:
  - path: /etc/systemd/system/spacetimedb.service
    content: |
      [Unit]
      Description=SpacetimeDB
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=spacetimedb
      WorkingDirectory=/stdb
      # page pool defaults to 8 GiB; keep it well under the instance's RAM.
      ExecStart=/stdb/spacetime --root-dir=/stdb start --listen-addr=127.0.0.1:3000 --page_pool_max_size=1073741824
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  # Nuxt server (UI, Nemotron agent, Photon). Secrets come from /etc/hackutd/web.env,
  # written by deploy-web.sh. Waits quietly until the first deploy puts the build in place.
  - path: /etc/systemd/system/hackutd-web.service
    content: |
      [Unit]
      Description=HackUTD Nuxt app
      After=network-online.target spacetimedb.service
      Wants=network-online.target
      ConditionPathExists=/srv/web/.output/server/index.mjs

      [Service]
      User=webapp
      WorkingDirectory=/srv/web
      Environment=HOST=127.0.0.1 PORT=3001 NODE_ENV=production
      EnvironmentFile=-/etc/hackutd/web.env
      ExecStart=/usr/bin/node /srv/web/.output/server/index.mjs
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  - path: /etc/caddy/Caddyfile
    content: |
      __SPACETIME_HOST__ {
        # SpacetimeDB: browser clients only need identity tokens and the websocket endpoint.
        @stdb path_regexp ^/v1/(identity(/.*)?|database/[^/]+/subscribe)$
        handle @stdb {
          reverse_proxy 127.0.0.1:3000
        }
        # Any other SpacetimeDB path (publish, SQL, HTTP calls) stays private.
        handle /v1/* {
          respond "Not found" 404
        }
        # Bare-bones test client (static build).
        redir /test /test/
        handle_path /test/* {
          root * /srv/test-client
          try_files {path} /index.html
          file_server
        }
        # Everything else: the Nuxt app.
        handle {
          reverse_proxy 127.0.0.1:3001
        }
      }

runcmd:
  # Swap so the TypeScript module host has headroom on 1-2 GB plans.
  - [
      bash,
      -c,
      "if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi",
    ]
  - [
      bash,
      -c,
      'id spacetimedb || useradd --system --home-dir /stdb --create-home --shell /usr/sbin/nologin spacetimedb',
    ]
  - [
      bash,
      -c,
      'id webapp || useradd --system --home-dir /srv/web --create-home --shell /usr/sbin/nologin webapp',
    ]
  - [bash, -c, 'mkdir -p /srv/test-client /etc/hackutd && chmod 750 /etc/hackutd']
  # Node 22 LTS for the Nuxt server.
  - [bash, -c, 'curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs']
  - [
      bash,
      -c,
      "sudo -u spacetimedb -H bash -c 'curl -sSf https://install.spacetimedb.com | sh -s -- --root-dir /stdb --yes'",
    ]
  # The owner CLI on this box always talks to its own server (used by deploy.sh/stdb.sh over SSH).
  - [bash, -c, 'sudo -u spacetimedb -H /stdb/spacetime --root-dir=/stdb server set-default local']
  - [
      bash,
      -c,
      'IP=$(curl -sf http://169.254.169.254/v1/interfaces/0/ipv4/address || curl -sf https://ifconfig.me) && sed -i "s/__SPACETIME_HOST__/${IP//./-}.sslip.io/" /etc/caddy/Caddyfile',
    ]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, spacetimedb]
  - [systemctl, enable, hackutd-web]
  - [systemctl, restart, caddy]
  - [ufw, allow, OpenSSH]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, --force, enable]
